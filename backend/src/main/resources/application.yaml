server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sixthproject
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # Redis — автоматты қосылмасын (жоқ болса ignore)
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  mail:
    host: smtp.gmail.com
    port: 587
    username: abzalsag@gmail.com
    password: joauffbobmvbdcgr
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# MinIO — өшірілген (жергілікті файл жүйесі қолданылады)
minio:
  enabled: false
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: images

# Жергілікті файл жүктеу қалтасы
app:
  upload-dir: uploads

logging:
  level:
    root: WARN
    com.example.sixthproject: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN

stripe:
  api:
    key: sk_test_YOUR_KEY
  webhook:
    secret: whsec_YOUR_WEBHOOK_SECRET
  currency: KZT

firebase:
  service-account-path: firebase-service-account.json