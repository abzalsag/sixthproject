server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  datasource:
    # Railway: JDBC_DATABASE_URL немесе жергілікті localhost
    # Railway панелінде: Variables → Add → JDBC_DATABASE_URL = jdbc:postgresql://...
    url: ${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/sixthproject}}
    username: ${PGUSER:${DB_USERNAME:postgres}}
    password: ${PGPASSWORD:${DB_PASSWORD:postgres}}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # Redis — өшірілген
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:abzalsag@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# MinIO — өшірілген (жергілікті файл жүйесі)
minio:
  enabled: false
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: images

# Жергілікті файл жүктеу
app:
  upload-dir: ${UPLOAD_DIR:uploads}

# JWT
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000

logging:
  level:
    root: WARN
    com.example.sixthproject: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN

stripe:
  api:
    key: ${STRIPE_KEY:sk_test_YOUR_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK:whsec_YOUR_WEBHOOK_SECRET}
  currency: KZT

firebase:
  service-account-path: ${FIREBASE_SA_PATH:firebase-service-account.json}