version: '3.8'

services:
  # --- MinIO (Файл сақтау) ---
  minio:
    image: minio/minio
    container_name: sixth-project-minio
    ports:
      - "9000:9000" # API port
      - "9090:9090" # Console port (Браузерден кіру үшін)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9090"
    volumes:
      - minio_data:/data

  # --- Redis (Кэш) ---
  redis:
    image: redis:alpine
    container_name: sixth-project-redis
    ports:
      - "6379:6379"

volumes:
  minio_data: