version: '3.8'

services:
  # --- Backend (Spring Boot) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sixth-project-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sixthproject
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - STRIPE_API_KEY=sk_test_placeholder
      - STRIPE_WEBHOOK_SECRET=whsec_placeholder
      - STRIPE_CURRENCY=KZT
    depends_on:
      - postgres
      - redis
      - minio

  # --- Frontend (React + Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sixth-project-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend

  # --- PostgreSQL ---
  postgres:
    image: postgres:15-alpine
    container_name: sixth-project-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sixthproject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Redis (Кэш) ---
  redis:
    image: redis:alpine
    container_name: sixth-project-redis
    ports:
      - "6379:6379"

  # --- MinIO (Файл сақтау) ---
  minio:
    image: minio/minio
    container_name: sixth-project-minio
    ports:
      - "9000:9000"
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9090"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
